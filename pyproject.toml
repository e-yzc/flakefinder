[project]
name = "flake-detector"
version = "0.1.0"
description = "Compact pretraining pipeline for class-agnostic flake instance segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.3",
  "matplotlib>=3.8",
  "opencv-python-headless>=4.9",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
  "ipykernel",
  "ipywidgets",
  "pip"
]

[dependency-groups]
dev = [
  "pytest>=8.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flake_detector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
